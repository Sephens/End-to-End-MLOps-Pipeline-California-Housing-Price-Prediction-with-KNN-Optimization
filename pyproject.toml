[tool.poetry]
name = "california-housing-mlops"
version = "1.0.0"
description = "End-to-end MLOps pipeline for California Housing price prediction"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "app" },
    { include = "pipeline" },
    { include = "flows" },
]

[tool.poetry.dependencies]
python          = "^3.10"
fastapi         = "^0.111.0"
uvicorn         = { extras = ["standard"], version = "^0.30.0" }
pydantic        = "^2.7.0"
scikit-learn    = "^1.5.0"
pandas          = "^2.2.0"
numpy           = "^1.26.0"
mlflow          = "^2.13.0"
prefect         = "^2.19.0"

[tool.poetry.group.dev.dependencies]
pytest          = "^8.2.0"
pytest-cov      = "^5.0.0"
httpx           = "^0.27.0"   # required by FastAPI TestClient
ruff            = "^0.4.0"
ipykernel       = "^6.29.0"
matplotlib      = "^3.9.0"
seaborn         = "^0.13.0"

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"

[tool.ruff]
line-length = 100
select      = ["E", "F", "I"]

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
